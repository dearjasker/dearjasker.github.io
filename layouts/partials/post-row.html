<article class="post-row" data-title="{{ .Title }}" data-category="{{ delimit .Params.categories " " }}"><div class="post-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time>{{ range .Params.categories }}<span>{{ . }}</span>{{ end }}{{ if .Params.example }}<span class="sample">{{ if eq .Lang "zh" }}示例文章{{ else }}Sample{{ end }}</span>{{ end }}</div><a class="post-title" href="{{ .RelPermalink }}"><h3>{{ .Title }}</h3><span>↗</span></a><p>{{ .Description }}</p></article>
